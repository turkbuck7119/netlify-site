<script>
function send() {
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text) return;

  add(text, "user");
  input.value = "";

  setTimeout(() => {
    add(reply(text), "bot");
  }, 500);
}

function add(text, cls) {
  const div = document.createElement("div");
  div.className = cls;
  div.innerText = text;
  document.getElementById("messages").appendChild(div);
}
